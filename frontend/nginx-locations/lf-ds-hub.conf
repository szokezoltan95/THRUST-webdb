location = /dronesoccer {
    return 308 /dronesoccer/$is_args$args;
}

location ^~ /dronesoccer/ {
    # Resolve on demand so THRUST can start with the hub offline and survive its recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $lf_ds_hub http://lf-ds-hub:8000;
    client_max_body_size 6m;
    proxy_connect_timeout 3s;
    proxy_pass $lf_ds_hub$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
