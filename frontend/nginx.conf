# Per-client request limits; map only the methods and endpoints that need throttling.
map "$request_method:$uri" $thrust_login_limit_key {
    default "";
    "POST:/api/auth/login" $binary_remote_addr;
}
map "$request_method:$uri" $thrust_register_limit_key {
    default "";
    "POST:/api/auth/register" $binary_remote_addr;
}
map "$request_method:$uri" $thrust_researcher_register_limit_key {
    default "";
    "POST:/api/auth/register/researcher" $binary_remote_addr;
}
map "$request_method:$uri" $thrust_data_request_limit_key {
    default "";
    "POST:/api/student/data-requests" $binary_remote_addr;
}
map "$request_method:$uri" $thrust_student_export_limit_key {
    default "";
    "GET:/api/student/data-export" $binary_remote_addr;
}
map "$request_method:$uri" $thrust_staff_heavy_limit_key {
    default "";
    ~^GET:/api/admin/(data-requests/[^/]+/export|measurements/[^/]+/raw|reports/(trends\.png|trends\.csv|measurements\.csv|all-data\.zip))$ $binary_remote_addr;
}

limit_req_zone $thrust_login_limit_key zone=thrust_login:10m rate=10r/m;
limit_req_zone $thrust_register_limit_key zone=thrust_register:10m rate=5r/m;
limit_req_zone $thrust_researcher_register_limit_key zone=thrust_researcher_register:10m rate=3r/m;
limit_req_zone $thrust_data_request_limit_key zone=thrust_data_request:10m rate=5r/m;
limit_req_zone $thrust_student_export_limit_key zone=thrust_student_export:10m rate=2r/m;
limit_req_zone $thrust_staff_heavy_limit_key zone=thrust_staff_heavy:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 70m;

    location /api/live/ {
        proxy_pass http://backend:8000/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=thrust_login burst=20 nodelay;
        limit_req zone=thrust_register burst=10 nodelay;
        limit_req zone=thrust_researcher_register burst=5 nodelay;
        limit_req zone=thrust_data_request burst=5 nodelay;
        limit_req zone=thrust_student_export burst=2 nodelay;
        limit_req zone=thrust_staff_heavy burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @thrust_rate_limited;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @thrust_rate_limited {
        default_type application/json;
        return 429 '{"detail":"Príliš veľa požiadaviek. Skús to znova o chvíľu."}';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
