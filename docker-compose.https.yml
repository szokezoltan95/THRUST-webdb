services:
  frontend:
    networks:
      default:
      hub_proxy:
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx-locations/lf-ds-hub.conf:/etc/nginx/thrust-locations/lf-ds-hub.conf:ro
networks:
  hub_proxy:
    name: thrust_webdb_hub_proxy
