services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thrust}
      POSTGRES_USER: ${POSTGRES_USER:-thrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thrust} -d ${POSTGRES_DB:-thrust}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://thrust:change-me@db:5432/thrust}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      PUBLIC_MIN_GROUP_SIZE: ${PUBLIC_MIN_GROUP_SIZE:-10}
      MEASUREMENT_STORAGE_PATH: ${MEASUREMENT_STORAGE_PATH:-/var/lib/thrust-webdb/measurements}
      MAX_RAW_UPLOAD_BYTES: ${MAX_RAW_UPLOAD_BYTES:-50000000}
    volumes:
      - measurement_data:/var/lib/thrust-webdb/measurements
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  measurement_data:
